[package]
name = "ship"
version.workspace = true
edition.workspace = true
authors.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Terminal workspace for coding agents: tabs and panes that keep running after the window closes"

[features]
self-update = ["dep:self_update"]

[dependencies]
clap.workspace = true
clap_complete.workspace = true
etcetera.workspace = true
futures-util.workspace = true
ship-client.workspace = true
ship-server.workspace = true
ship-core = { workspace = true, features = ["clap"] }

tokio.workspace = true
tracing.workspace = true
tracing-chrome.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
serde.workspace = true
chrono.workspace = true
reqwest.workspace = true
url.workspace = true
self_update = { version = "1.3", optional = true, default-features = false, features = ["async", "rustls", "github", "compression-tar-gz", "checksums"] }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[lints]
workspace = true
