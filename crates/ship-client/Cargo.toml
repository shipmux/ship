[package]
name = "ship-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
readme.workspace = true
license.workspace = true
description = "HTTP client library and full-screen client for Ship"

[dependencies]
ship-core = { workspace = true, features = ["run"] }
ship-macros.workspace = true
tracing.workspace = true

crokey.workspace = true
crossterm = { workspace = true, features = ["bracketed-paste", "event-stream", "osc52"] }
etcetera.workspace = true
fastrand = "2"
futures-util.workspace = true
indexmap.workspace = true
mitsein.workspace = true
notify-debouncer-mini.workspace = true
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
reqwest = { workspace = true, features = ["query"] }
rodio.workspace = true
semver = { version = "1", features = ["serde"] }
serde.workspace = true
strum.workspace = true
serde_json.workspace = true
sse-stream.workspace = true
url.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }
toml.workspace = true
tui-input.workspace = true
tokio-stream.workspace = true
tui-markdown = { version = "0.3", default-features = false }

[lints]
workspace = true
